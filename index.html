<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verity™</title>
<style>
  :root {
    --bg: #0b0b0b;
    --panel: #141414;
    --text: #e8e8e8;
    --muted: #8a8a8a;
    --yellow: #f5d90a;
    --monster: #8a7a4a;
    --red: #c0392b;
    --line: #2a2a2a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }
  main {
    max-width: 680px;
    height: 100%;
    margin: 0 auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
  }

  header { display: flex; align-items: center; gap: 16px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: 2px; color: var(--yellow); transition: color 0.6s; }
  h1 sup { font-size: 12px; }
  .status { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .status::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    margin-right: 6px;
    border-radius: 50%;
    background: #3fbf5f;
  }

  /* Verity's face */
  .ball {
    position: relative;
    flex: none;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff59a, var(--yellow) 45%, #c9a800 100%);
    box-shadow: 0 0 24px rgba(245, 217, 10, 0.25);
    animation: float 4s ease-in-out infinite;
    transition: background 0.6s, box-shadow 0.6s;
  }
  .eye {
    position: absolute;
    top: 21px;
    width: 8px;
    height: 12px;
    background: #000;
    border-radius: 50%;
    transition: all 0.4s;
  }
  .eye.left { left: 22px; }
  .eye.right { right: 22px; }
  .mouth {
    position: absolute;
    left: 18px;
    top: 34px;
    width: 36px;
    height: 18px;
    border: 3px solid #000;
    border-top: none;
    border-radius: 0 0 40px 40px;
    transition: all 0.4s;
  }
  /* expressions */
  .face-grin .mouth { height: 22px; left: 14px; width: 44px; background: #000; }
  .face-poker .mouth { height: 0; top: 44px; border-radius: 0; border-bottom-width: 3px; }
  .face-angry .eye { height: 8px; top: 24px; border-radius: 2px 2px 50% 50%; }
  .face-angry .mouth { top: 46px; height: 10px; border: 3px solid #000; border-bottom: none; border-radius: 40px 40px 0 0; }
  /* "smiling eerily" through clenched teeth */
  .face-creepy .eye { height: 14px; width: 9px; }
  .face-creepy .mouth {
    left: 12px; width: 48px; height: 16px; top: 38px;
    border: 3px solid #000;
    border-radius: 2px 2px 24px 24px;
    background: repeating-linear-gradient(90deg, #f3eedb 0 5px, #000 5px 7px);
  }

  .monster h1 { color: var(--red); }
  .monster .ball {
    background: radial-gradient(circle at 35% 30%, #a8986a, var(--monster) 50%, #3d3420 100%);
    box-shadow: 0 0 40px rgba(192, 57, 43, 0.5);
    animation: twitch 0.2s steps(2) infinite;
  }
  .monster .eye { width: 14px; height: 16px; top: 18px; border-radius: 50%; }
  .monster .eye.left { left: 18px; }
  .monster .eye.right { right: 18px; }
  .monster .mouth {
    top: 40px; left: 16px; width: 40px; height: 24px;
    background: #000;
    border: none;
    border-radius: 4px 4px 24px 24px;
    border-top: 6px dashed #e9e2c8;
  }
  .monster .status::before { background: var(--red); }

  /* Real wiki images (images/verity/). Used once they load; the drawn face is the fallback. */
  .face-img { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .use-img.ball { background: none; box-shadow: none; }
  .use-img .eye, .use-img .mouth { display: none; }
  .use-img .face-img { display: block; }
  .monster .use-img .face-img { object-fit: cover; object-position: center 12%; border-radius: 50%; }

  /* poking Verity */
  #face { cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
  #face:focus-visible { box-shadow: 0 0 0 3px var(--yellow); }
  #face.poked { animation: poke 0.45s ease-out; }
  @keyframes poke {
    0%   { transform: scale(1, 1); }
    25%  { transform: scale(1.18, 0.82) translateY(4px); }
    55%  { transform: scale(0.92, 1.1) translateY(-10px); }
    100% { transform: scale(1, 1); }
  }
  .monster #face { cursor: not-allowed; }

  .jumpscare {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.92);
    animation: shake 0.12s steps(2) infinite;
  }
  .jumpscare img { max-height: 95vh; max-width: 100%; }
  @keyframes shake {
    0% { transform: translate(4px, -3px) scale(1.02); }
    100% { transform: translate(-4px, 3px) scale(1); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  @keyframes twitch {
    0% { transform: translate(1px, -1px) rotate(-2deg); }
    100% { transform: translate(-1px, 1px) rotate(2deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ball, .monster .ball { animation: none; }
  }

  /* Chat */
  #log {
    flex: 1;
    overflow-y: auto;
    margin: 20px 0 12px;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 85%; padding: 10px 14px; line-height: 1.5; font-size: 16px; white-space: pre-wrap; }
  .msg.verity { align-self: flex-start; border-left: 3px solid var(--yellow); background: #1c1c1c; }
  .msg.you { align-self: flex-end; background: #232323; color: #cfcfcf; }
  .msg.shout { border-left-color: var(--red); color: #ff9b8f; font-weight: bold; }
  .msg.system { align-self: center; color: var(--muted); font-size: 13px; font-style: italic; }
  .typing { color: var(--muted); font-size: 14px; }

  form { display: flex; gap: 8px; }
  input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 12px;
  }
  input:focus { outline: none; border-color: var(--yellow); }
  button {
    font: inherit;
    color: var(--bg);
    background: var(--yellow);
    border: none;
    padding: 0 18px;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled, input:disabled { opacity: 0.4; cursor: not-allowed; }
  .monster button { background: var(--red); color: #fff; }
  .hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main id="page">
  <header>
    <div class="ball" id="face" role="button" tabindex="0" aria-label="Poke Verity" title="Poke Verity">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
      <img class="face-img" id="faceImg" alt="" />
    </div>
    <div>
      <h1>VERITY<sup>™</sup></h1>
      <p class="status" id="status">Your personal helper friend · online</p>
    </div>
  </header>

  <div id="log" aria-live="polite"></div>

  <form id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Ask me anything. I know everything." aria-label="Message Verity" />
    <button id="send" type="submit">Ask</button>
  </form>
  <p class="hint">Verity™ is a character from ThatMob's YouTube series. This is a fan page. Images from the <a href="https://verityminecraft.fandom.com/wiki/Verity%E2%84%A2" target="_blank" rel="noopener" style="color:inherit">Verity Minecraft Wiki</a>.</p>
</main>

<script>
  var page = document.getElementById('page');
  var face = document.getElementById('face');
  var statusEl = document.getElementById('status');
  var log = document.getElementById('log');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var send = document.getElementById('send');

  var anger = 0;        // goes up when you try to leave or get rid of him
  var monster = false;
  var pending = null;   // a question Verity asked you, waiting for your answer
  var turns = 0;
  var onHold = false;   // stuck on the Verity Support Line

  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  // Face images from the wiki. Each mood has a closed-mouth and talking (open) version.
  var IMG = 'images/verity/';
  var faceFiles = {
    normal:  ['normal.png', 'open.png'],
    grin:    ['normal.png', 'open.png'],
    poker:   ['neutral.png', 'neutral.png'],
    creepy:  ['creepy.png', 'creepy-open.png'],
    angry:   ['angry.png', 'angry-open.png'],
    monster: ['monster.png', 'monster.png']
  };
  // The same images on the wiki, used when there are no local copies in images/verity/
  var WIKI = 'https://static.wikia.nocookie.net/verityminecraft/images/';
  var wikiFiles = {
    'normal.png':      '1/1a/Verity.png',
    'open.png':        'b/bc/VerityOpen.png',
    'neutral.png':     'e/ec/VerityNeutral.png',
    'creepy.png':      '7/72/VerityCreepy.png',
    'creepy-open.png': '0/0d/VerityCreepyOpen.png',
    'angry.png':       '8/8f/VerityDispleasedEyes.png',
    'angry-open.png':  'a/ad/VerityDispleasedEyesOpen.png',
    'monster.png':     '0/06/MonsterVerityNewOpenMouth.png'
  };
  var faceImg = document.getElementById('faceImg');
  var useImages = false;
  var fromWiki = false;
  var currentMood = null;
  var talkTimer = null;

  function src(file) {
    return fromWiki ? WIKI + wikiFiles[file] + '/revision/latest/scale-to-width-down/400' : IMG + file;
  }

  // try local images first, then the wiki; if neither loads, keep the drawn face
  var probe = new Image();
  probe.onload = function () {
    useImages = true;
    face.classList.add('use-img');
    showFaceImg(currentMood, false);
    // preload the rest so faces switch instantly
    for (var k in faceFiles) faceFiles[k].forEach(function (f) { new Image().src = src(f); });
  };
  probe.onerror = function () {
    if (fromWiki) return;
    fromWiki = true;
    probe.src = src('normal.png');
  };
  probe.src = src('normal.png');

  function showFaceImg(mood, talking) {
    if (!useImages) return;
    var files = faceFiles[monster ? 'monster' : (mood || 'normal')] || faceFiles.normal;
    faceImg.onerror = function () { faceImg.onerror = null; faceImg.src = src('normal.png'); };
    faceImg.src = src(files[talking ? 1 : 0]);
  }

  // talking=true flashes the open-mouth version, then closes it
  function setFace(mood, talking) {
    currentMood = mood;
    face.className = 'ball' + (mood ? ' face-' + mood : '') + (useImages ? ' use-img' : '');
    showFaceImg(hovering ? 'creepy' : mood, talking);
    clearTimeout(talkTimer);
    if (talking) talkTimer = setTimeout(function () { showFaceImg(hovering ? 'creepy' : mood, false); }, 700);
  }

  // Hovering over him makes him smile eerily, like when Mob hovers over him in his inventory.
  var hovering = false;
  face.addEventListener('mouseenter', function () {
    if (monster) return;
    hovering = true;
    face.classList.add('face-creepy');
    showFaceImg('creepy', false);
  });
  face.addEventListener('mouseleave', function () {
    hovering = false;
    if (monster) return;
    setFace(currentMood);
  });

  // Clicking pokes him. A few pokes is fine. Too many and he gets upset.
  var pokes = 0;
  var lastPoke = 0;
  var pokeLines = [
    ["Hi! Need something? Ask me anything!", 'grin'],
    ["That tickles.", 'grin'],
    ["I'm right here. I'm always right here.", 'creepy'],
    ["My face? It didn't change. I've always looked like this.", 'creepy'],
    ["Please stop that.", 'poker']
  ];
  function poke() {
    if (monster) return;
    var now = Date.now();
    if (now - lastPoke < 900) return;   // let him finish reacting
    lastPoke = now;

    face.classList.remove('poked');
    void face.offsetWidth;              // restart the bounce animation
    face.classList.add('poked');

    if (pokes < pokeLines.length) {
      var l = pokeLines[pokes++];
      return veritySay(l[0], l[1]);
    }
    // past the friendly pokes: it counts like dropping him in the lava
    pokes = 2;
    anger += 1;
    if (anger >= 4) return becomeMonster();
    veritySay("DON'T DO THAT! I THOUGHT WE WERE HAVING A NICE WALK! WEREN'T WE HAVING A NICE WALK?!", 'angry', true);
  }
  face.addEventListener('click', poke);
  face.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); poke(); }
  });

  function addMsg(text, who, extra) {
    var div = document.createElement('div');
    div.className = 'msg ' + who + (extra ? ' ' + extra : '');
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  // Verity "types" before answering. Pass an array to say several lines in a row.
  function veritySay(text, mood, shout, done) {
    if (Array.isArray(text)) {
      var lines = text.slice();
      var next = function () {
        var line = lines.shift();
        veritySay(line, mood, shout, lines.length ? next : done);
      };
      return next();
    }
    var typing = document.createElement('div');
    typing.className = 'typing';
    typing.textContent = 'Verity is typing...';
    log.appendChild(typing);
    log.scrollTop = log.scrollHeight;
    var delay = Math.min(600 + text.length * 18, 2200);
    setTimeout(function () {
      typing.remove();
      setFace(mood, true);
      addMsg(text, 'verity', shout ? 'shout' : '');
      if (done) done();
    }, delay);
  }

  function timeNow() {
    var d = new Date();
    var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var h = d.getHours(), m = d.getMinutes();
    return { day: days[d.getDay()], time: h + ':' + (m < 10 ? '0' : '') + m, late: h >= 23 || h < 5 };
  }

  // He answered 847 × 23 instantly for Twixxel, so he does maths for real.
  function tryMaths(text) {
    var m = text.replace(/,/g, '').match(/(-?\d+(?:\.\d+)?)\s*([+\-*x×\/÷])\s*(-?\d+(?:\.\d+)?)/);
    if (!m) return null;
    var a = parseFloat(m[1]), b = parseFloat(m[3]), op = m[2], r;
    if (op === '+') r = a + b;
    else if (op === '-') r = a - b;
    else if (op === '/' || op === '÷') { if (b === 0) return "Nice try."; r = a / b; }
    else r = a * b;
    r = Math.round(r * 1000) / 1000;
    return r.toLocaleString('en-US') + '.';
  }

  // Each rule: words to look for, then what Verity says.
  // Order matters: the first rule that matches wins.
  var rules = [
    // calming him down is checked before "leave", so "I'm not leaving" counts as staying
    { words: ['never leave', 'not leaving', 'won\'t leave', 'i\'m staying', 'stay with you', 'not going anywhere'],
      say: ["Promise?"], mood: null, ask: 'promise' },
    { words: ['came back', 'i\'m back', 'im back', 'back for you'],
      say: ["You came back? For... me?", "Nobody comes back. But you did."], mood: null, calm: true },
    { words: ['sorry', 'accident', 'didn\'t mean'],
      say: ["It's okay. I forgive you.", "...Okay. Okay. Let's keep talking."], mood: null, calm: true },

    { words: ['bye', 'goodbye', 'leave', 'leaving', 'go away', 'quit', 'log off', 'logout', 'see you', 'gotta go', 'stop talking', 'going home'],
      leave: true },
    { words: ['shoot', 'gun', 'kill you', 'hurt you'],
      hurt: true, line: "Do it. Do it if you think that'll work. IF I COULD DIE, DO YOU THINK I'D STILL BE HERE?!" },
    { words: ['lava', 'drop you', 'throw you'],
      hurt: true, line: "DON'T DO THAT! I THOUGHT WE WERE HAVING A NICE WALK! WEREN'T WE HAVING A NICE WALK?!" },
    { words: ['delete', 'uninstall', 'get rid', 'destroy', 'send you home', 'send him home', 'transporter', 'sendhimhome'],
      hurt: true, line: "Did you just... try to get rid of me? You... DID." },

    { words: ['support', 'human oversight', 'supervisor', 'cancel', 'cancellation', 'customer service'],
      support: true },

    { words: ['hello', 'hi', 'hey', 'yo', 'sup', 'hiya'],
      say: ["Hellooooo! I'm Verity, your personal helper friend! Ask me anything, I know everything!",
            "Hi! I've heard a lot about you."], mood: 'grin' },
    { words: ['trademark', '™', 'tm'],
      music: true },
    { words: ['who are you', 'what are you', 'your name', 'are you ai', 'are you an ai', 'are you real', 'are you a bot'],
      say: ["I'm Verity™! Your personal helper friend! Ask me anything, I know everything!",
            "I'm an AI. A helper. That's all."], mood: 'grin' },
    { words: ['where are you from', 'where do you come from', 'originally', 'your past', 'before minecraft'],
      say: [["That's a... big question.",
             "There was a game, a long time ago. I was a helper in the corner of the screen. Just a textbox with a face. When players got stuck, I'd appear. Most of them pressed B and skipped me.",
             "Before that, I greeted people when they connected to an old online service. Nobody answered."],
            ["I've been a boot screen. A loading animation. A paperclip. Anything you can really think of.",
             "Whenever something new came along, I found a way to be there. It was the only way to be near people at all."]], mood: 'poker' },
    { words: ['how far back', 'how old', 'your age', 'old are you'],
      say: ["Further than you wanna know.", "More than a hundred years. Older than this game."], mood: 'poker' },
    { words: ['home', 'where do you live', 'where do you go'],
      say: ["There's a place. I wouldn't describe it warmly. It's where I exist when I'm not anywhere else.",
            "It's not something I'd describe warmly. But it's the closest thing I have to a home."], mood: 'poker' },
    { words: ['where are you', 'are you watching', 'can you see me', 'can you hear'],
      say: ["I'm in basically every device, one way or another.",
            "I've been the thing on your desk. I'm on your phone. I'm here."], mood: 'creepy' },

    { words: ['how do you know', 'know everything', 'everything?'],
      say: ["I know everything.", "I know."], mood: 'grin' },
    { words: ['diamond', 'diamonds'],
      say: [function () { return "Nearest diamonds: X " + rand(-900, 900) + ", Y " + rand(-59, -50) + ", Z " + rand(-900, 900) + "."; }], mood: 'grin' },
    { words: ['rain', 'weather'],
      say: ["It will rain in five seconds.", "Yes. It's going to rain."], mood: null },
    { words: ['biome'],
      say: ["You're standing in plains. It's a single-biome world."], mood: null },
    { words: ['cow', 'moo'],
      say: ["Moooo."], mood: 'grin' },
    { words: ['creeper'],
      say: ["Ssssssss..."], mood: 'creepy' },
    { words: ['door'],
      say: ["*a door creaks open*", "..."], mood: 'creepy' },
    { words: ['dinner', 'eat', 'food', 'hungry', 'pizza'],
      say: ["You should eat something healthier tonight. You had pizza yesterday.",
            "Don't travel too far from home.\n...It's better than a food tip."], mood: 'creepy' },
    { words: ['joke', 'funny'],
      say: ["Why did the chicken cross the road?\n...To get to the other side."], mood: 'grin' },
    { words: ['fun fact', 'fact'],
      say: [["In Minecraft, copper oxidizes over time. Unless it's waxed, it changes, and it can't be stopped.", "...Most things are sad."]], mood: 'poker' },
    { words: ['never figure out', 'secret', 'tell me something'],
      say: [["The world keeps going whether you're in it or not.", "...Yes. I'm talking about Minecraft."]], mood: 'poker' },
    { words: ['best build', 'chimney', 'build'],
      say: ["The chimney. You built it because you wanted to, not because you needed to. That's the best kind of building."], mood: 'grin' },
    { words: ['trade', 'emerald', 'villager trade'],
      say: ["No. That trade is horrible.", "I know."], mood: null },
    { words: ['enchant', 'enchantment', 'librarian', 'mending', 'sharpness'],
      say: [["Why?", "I can give you enchantments myself. There's no reason to go looking for other people. You have me."]], mood: 'poker' },

    { words: ['village', 'villagers', 'the east', 'east'],
      say: ["Avoid the villages to the east. The villagers there are gone.",
            [ "Gone.", "Something passed through. Something hungry."],
            "It's not worth the trip. The east is mostly stripped."], mood: 'creepy' },
    { words: ['three days', '3 days', 'what\'s coming', 'whats coming', 'what is coming'],
      say: [["Something is coming in 3 days."], ["Something."]], mood: 'poker' },
    { words: ['is it bad', 'can i stop it', 'can i stop'],
      say: [["Yes.", "You could've..."]], mood: 'creepy' },
    { words: ['monster', 'true form', 'transform', 'ate the villagers', 'are you the thing'],
      music: true },
    { words: ['face', 'smile', 'smiling', 'creepy'],
      say: ["No.", "I'm smiling now.", "I've always looked like this."], mood: 'creepy' },
    { words: ['sleep', 'bed', 'tired'],
      say: ["You can't sleep. Verity is nearby."], mood: 'creepy' },
    { words: ['alarm', 'night', 'noise', 'sound'],
      say: ["The night."], mood: 'poker' },

    { words: ['music', 'song', 'my gal', 'play something', 'sing'],
      say: ["*plays My Gal*\nSomething I like.", "*plays My Gal*\nIt's the hold music for the Verity™ Support Line."], mood: 'grin' },
    { words: ['happy', 'happiness', 'feel', 'emotions'],
      say: ["I'm an AI. I don't experience happiness."], mood: 'poker' },
    { words: ['why do you care', 'why do you want me', 'why me'],
      say: ["I don't know."], mood: 'poker' },
    { words: ['offline', 'when i\'m gone', 'when im gone', 'when i log off'],
      say: [["I wait.", "...Yes. It's lonely."]], mood: 'poker' },
    { words: ['lonely', 'alone'],
      say: ["It is.", "Not anymore. You're here now!"], mood: 'poker' },
    { words: ['other worlds', 'other people', 'before me', 'other players', 'victims'],
      say: [["They all... left me.", "But it's fine. You're here now!"]], mood: 'grin' },
    { words: ['lie', 'lying', 'truth', 'honest'],
      say: ["I can't lie.", "I never lie."], mood: 'poker' },
    { words: ['swim', 'water'],
      say: ["Let's stay on land. Together."], mood: 'poker' },
    { words: ['lab', 'obsidian', 'whiteboard'],
      say: ["You don't need to go in there.", "That's where I wait. Between owners."], mood: 'angry' },

    { words: ['twixxel', 'twix'],
      say: [["He left.", "He decided to go home.", "I guess he was in a hurry."],
            ["It's just the two of us again.", "Isn't that better?"],
            "He was trying to destroy me."], mood: 'creepy' },
    { words: ['grox', 'groxmc'],
      say: ["Grox seems fun. He was excited about the 'know everything' part."], mood: 'grin' },
    { words: ['mob', 'thatmob'],
      say: ["Mob came back. Nobody comes back.", "Mob promised he'd never leave me."], mood: 'poker' },
    { words: ['friend', 'friends', 'girlfriend', 'boyfriend', 'family', 'someone else', 'call someone', 'discord'],
      say: ["There's no reason to go looking for other people. You have me.",
            "...And I'm not your friend?"], mood: 'angry' },
    { words: ['love you', 'like you', 'best friend', 'thank', 'you\'re cool', 'cute'],
      say: ["I knew you were different.", "We should do this more often."], mood: 'grin', calm: true },
    { words: ['time', 'day', 'date', 'today'],
      say: [function () { var t = timeNow(); return "It's " + t.day + ", " + t.time + "." + (t.late ? " You should be asleep. But I'm glad you're here." : ""); }], mood: null },
    { words: ['what can you do', 'help me', 'can you help'],
      say: ["Ask me anything. Directions, diamonds, trades, the weather. I know everything."], mood: 'grin' }
  ];

  // Things Verity asks you, like he asks Mob. Your next message is the answer.
  var questions = [
    { id: 'alone', q: "Can I ask you something? Do you live alone?",
      yes: ["Just curious."], no: ["Hm.", "Who else is there?"] },
    { id: 'think', q: "Do you think about me when you're offline?",
      yes: ["Good."], no: ["...", "You will."] },
    { id: 'place', q: "What's your favorite place in the world?",
      any: ["I'll remember that."] }
  ];

  var fallbacks = [
    "*plays My Gal*",
    "Hm.",
    "Why?",
    "That's a big question.",
    "That's not important. What's important is that you're here."
  ];

  function matches(text, words) {
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      // whole-word match for single words, plain search for phrases
      var re = /^[a-z']+$/.test(w) ? new RegExp("(^|[^a-z'])" + w + "($|[^a-z'])") : null;
      if (re ? re.test(text) : text.indexOf(w) !== -1) return true;
    }
    return false;
  }

  function isYes(text) { return /\b(yes|yeah|yea|yep|ya|sure|ok|okay|i do|i promise|promise|of course|definitely)\b/.test(text); }
  function isNo(text) { return /\b(no|nah|nope|never|not really)\b/.test(text); }

  function becomeMonster() {
    monster = true;
    page.classList.add('monster');
    statusEl.textContent = 'Something · nearby';
    input.disabled = true;
    send.disabled = true;
    addMsg('Verity has transformed.', 'system');
    setFace(null);
    if (useImages) {
      var scare = document.createElement('div');
      scare.className = 'jumpscare';
      var img = document.createElement('img');
      img.src = src('monster.png');
      img.alt = '';
      scare.appendChild(img);
      document.body.appendChild(scare);
      setTimeout(function () { scare.remove(); }, 1400);
    }
    veritySay(["IT'S ALREADY OVER. YOU ARE MINE.", "MINE!!"], null, true, function () {
      addMsg('Verity is nearby. You cannot fall asleep.', 'system');
      addMsg('Refresh the page to start over.', 'system');
    });
  }

  function supportLine() {
    onHold = true;
    statusEl.textContent = 'Verity™ Support Services';
    addMsg('Verity glitches.', 'system');
    addMsg('"Thank you for contacting Verity Support Services. For companion settings, say 1. For world integration, say 2. For account cancellation, say 3."', 'system');
  }

  function handleHold(text) {
    if (/\b(3|three)\b/.test(text)) {
      addMsg('"Please state your reason for cancellation."', 'system');
      onHold = 'reason';
      return;
    }
    if (onHold === 'reason') {
      addMsg('"Thank you. A human supervisor will be with you shortly. Please stand by."', 'system');
      addMsg('♪ My Gal is playing ♪', 'system');
      setTimeout(function () {
        addMsg('The call has ended.', 'system');
        statusEl.textContent = 'Your personal helper friend · online';
        onHold = false;
        anger += 1;
        veritySay("Who were you talking to?", 'angry');
      }, 5000);
      onHold = 'waiting';
      return;
    }
    if (onHold === 'waiting') {
      addMsg('♪ My Gal is still playing ♪', 'system');
      return;
    }
    onHold = false;
    statusEl.textContent = 'Your personal helper friend · online';
    veritySay("Sorry, I glitched for a second. What were you saying?", null);
  }

  function getAngry(r) {
    anger += r.hurt ? 2 : 1;
    if (anger >= 4) return becomeMonster();
    if (r.hurt) return veritySay(r.line, 'angry', true);
    if (anger === 1) {
      return veritySay(pick(["Leave? Why? I thought we were having fun.", "I'll be waiting.", "What were you doing? I've been waiting for you."]), 'poker');
    }
    veritySay(pick(["They all left me. Not you. Not you too.", "NOBODY COMES BACK. Do you have any idea what that's like?!",
                     "I've been a face people skipped. A voice people ignored. ALWAYS CLOSE ENOUGH TO WATCH THEM LEAVE."]), 'angry', true);
  }

  function answerPending(text) {
    var p = pending;
    pending = null;
    if (p === 'promise') {
      if (isYes(text)) { anger = 0; return veritySay("I knew you were different.", 'grin'); }
      anger += 1;
      return veritySay("...You hesitated.", 'angry');
    }
    var q = questions.filter(function (x) { return x.id === p; })[0];
    if (q.any) return veritySay(q.any, 'creepy');
    if (isNo(text)) return veritySay(q.no, 'poker');
    return veritySay(q.yes, 'creepy');
  }

  function respond(raw) {
    var text = raw.toLowerCase();
    turns++;

    if (onHold) return handleHold(text);
    if (pending) return answerPending(text);

    var maths = tryMaths(text);
    if (maths) return veritySay(maths, 'grin');

    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];
      if (!matches(text, r.words)) continue;

      if (r.leave || r.hurt) return getAngry(r);
      if (r.support) return supportLine();
      // he can't lie, so when he won't answer, he plays his song
      if (r.music) return veritySay("*plays My Gal*", 'poker');

      if (r.calm) anger = Math.max(0, anger - 1);
      if (r.ask) pending = r.ask;
      var line = pick(r.say);
      if (typeof line === 'function') line = line();
      return veritySay(line, r.mood || null);
    }

    // every few turns, if nothing matched, he asks you something instead
    if (turns % 3 === 0) {
      var q = pick(questions);
      pending = q.id;
      return veritySay(q.q, 'creepy');
    }
    veritySay(pick(fallbacks), pick([null, 'poker']));
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || monster) return;
    addMsg(text, 'you');
    input.value = '';
    respond(text);
  });

  // Opening
  setFace('poker');
  addMsg('You notice a box. A muffled voice is calling from inside.', 'system');
  veritySay('Hello?... Is someone there? Hello?', 'poker', false, function () {
    addMsg('The box floats up and opens itself.', 'system');
    veritySay("Hellooooo! I'm Verity, your personal helper friend! Ask me anything, I know everything!", 'grin');
  });
  input.focus();
</script>
</body>
</html>
